services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: customers
      POSTGRES_PASSWORD: devsu
      POSTGRES_USER: devsu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsu -d customers"]
      interval: 5s
      timeout: 5s
      retries: 10

  customers-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customers
      DB_USERNAME: devsu
      DB_PASSWORD: devsu
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
